x-app-volumes: &app-volumes
  - ./:/app:rw,delegated
  # If you develop on Linux, comment out the following volumes to just use bind-mounted project directory from host
  - /app/var/
  - /app/var/cache/
  - /app/var/logs/
  - /app/var/sessions/

x-app-build: &app-build
  build:
    dockerfile: etc/artifact/Dockerfile
    context: .
    target: php-dev

services:

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./etc/dev/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    depends_on:
      - php

  code:
    <<: *app-build
    command: ["sleep", "infinity"]
    volumes: *app-volumes

  php:
    <<: *app-build
    environment:
      - XDEBUG_MODE=debug
      - XDEBUG_CLIENT_HOST=host.docker.internal
    volumes: *app-volumes
    depends_on:
      mysql:
        condition: service_healthy
      rmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  workers_events:
    <<: *app-build
    volumes: *app-volumes
    command: ['/app/bin/console', 'messenger:consume', 'events', '-vv', '--memory-limit=256M', '--time-limit=3600']
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  workers_users:
    <<: *app-build
    volumes: *app-volumes
    command: ['/app/bin/console', 'messenger:consume', 'users', '-vv', '--memory-limit=256M', '--time-limit=3600']
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  mysql:
    image: mysql:8.0.33
    command: --default-authentication-plugin=mysql_native_password
    volumes:
     - "./etc/ci/mysql:/etc/mysql/conf.d"
    tmpfs:
     - /var/lib/mysql/:rw,noexec,nosuid,size=600m
     - /tmp/:rw,noexec,nosuid,size=50m
    environment:
      - MYSQL_ROOT_PASSWORD=api
      - MYSQL_DATABASE=api
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-papi"]
      interval: 5s
      timeout: 5s
      retries: 10

  rmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_ERLANG_COOKIE: "SWQOKODSQALRPCLNMEQG"
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
      RABBITMQ_DEFAULT_VHOST: "/"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
    environment:
      - "discovery.type=single-node"
      - "cluster.name=sf-events"
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
