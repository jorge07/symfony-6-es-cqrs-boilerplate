framework:
    messenger:
        default_bus: messenger.bus.command
        failure_transport: failed
        buses:
            # Default middleware is disabled on command/query buses intentionally.
            # These buses follow CQRS: one command = one handler, one query = one handler.
            # Validation and routing middleware are not needed; only handle_message is used.
            messenger.bus.command:
                default_middleware: false
                middleware:
                    - handle_message

            messenger.bus.query:
                default_middleware: false
                middleware:
                    - handle_message

            messenger.bus.event.async:
                default_middleware: allow_no_handlers

        transports:
            events:
                dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
                retry_strategy:
                    delay: 2000
                    max_retries: 5
                    multiplier: 2
                    max_delay: 0
                options:
                    exchange:
                        type: topic
                        name: events
                    queues:
                        events:
                            binding_keys: ['#']

            users:
                dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
                retry_strategy:
                    delay: 2000
                    max_retries: 5
                    multiplier: 2
                    max_delay: 0
                options:
                    exchange:
                        type: topic
                        name: events
                    queues:
                        users:
                            binding_keys: ['#.User.#']
            failed:
                dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
                options:
                    queues:
                        failed:
                            binding_keys: ['#']

        routing:
            'Broadway\Domain\DomainMessage': events
