replicaCount: 1

autoscaling:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 85
  targetMemoryUtilizationPercentage: 80

image:
  php:
    repository: jorge07/cqrs
    tag: latest
  nginx:
    repository: jorge07/cqrs
    tag: nginx-latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: traefik
  path: /
  hosts:
    - demo.minikube.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 1G
  requests:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}

elasticsearch:
  selfHosted: true
  replicas: 1
  antiAffinity: "soft"
  esJavaOpts: "-Xmx128m -Xms128m"
  resources:
    limits:
      memory: 1G
    requests:
      cpu: 250m
      memory: 512Mi

rabbitmq:
  selfHosted: true
  rbacEnabled: true
  rabbitmq:
    username: guest
    password: guest
    erlangCookie: "SWQOKODSQALRPCLNMEQG"

mysql:
  selfHosted: true
  mysqlRootPassword: api
  mysqlUser: api
  mysqlDatabase: api
  imageTag: 8.0.16
  args:
  - --default-authentication-plugin=mysql_native_password

traefik:
  enabled: true
  rbac:
    enabled: true
  dashboard:
    enabled: true
    domain: traefik.local.minikube.com
  serviceType: NodePort

parameters:
  app:
    env: prod
    secret: change_me
  mysql:
    host: cqrs-mysql
    port: 3306
    database: api
    user: root
    pass: api
  rabbit:
    host: "amqp://guest:guest@cqrs-rabbitmq:5672"
  elastic:
    host: "elasticsearch-master:9200"
  jwt:
    hostPath: "/app/config/packages/jwt"
    # REPLACE: Mount your RSA private key via external secret (Vault, sealed-secrets, etc.)
    secretKey: ""
